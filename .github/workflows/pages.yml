name: Deploy to GitHub Pages
on:
  push:
    branches: [main, dual-look]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every publication contains both independently built branch heads.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
      - uses: actions/checkout@v4
        with:
          ref: dual-look
          path: preview-site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main-site/refinery-digital-twin-starter/package-lock.json
            preview-site/refinery-digital-twin-starter/package-lock.json
      - name: Build and test release
        working-directory: main-site/refinery-digital-twin-starter
        run: npm ci && npm run test -w app && npm run build -w app
      - name: Build and test preview
        working-directory: preview-site/refinery-digital-twin-starter
        run: npm ci && npm run test -w app && npm run build -w app
      - name: Assemble release and preview with provenance
        run: |
          mkdir -p site/next
          cp -a main-site/refinery-digital-twin-starter/app/dist/. site/
          cp -a preview-site/refinery-digital-twin-starter/app/dist/. site/next/
          MAIN_SHA=$(git -C main-site rev-parse HEAD) PREVIEW_SHA=$(git -C preview-site rev-parse HEAD) node -e 'const fs=require("fs"); for(const [path,branch,commit] of [["site/deploy.json","main",process.env.MAIN_SHA],["site/next/deploy.json","dual-look",process.env.PREVIEW_SHA]]) fs.writeFileSync(path,JSON.stringify({branch,commit})+"\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

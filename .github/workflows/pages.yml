name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dual-look]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: refinery-digital-twin-starter

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dual-look'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: refinery-digital-twin-starter/package-lock.json
      - run: npm ci
      - run: npm run test -w app
      # Builds from the committed data/normalized output (same as the Dockerfile); run
      # `npm run normalize` locally after editing data/synthetic.
      - run: npm run build -w app
      # Branch previews occupy /next/. The root is always built from main.
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/dual-look'
        with:
          ref: main
          path: main-site
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/dual-look'
        with:
          node-version: 22
      - run: npm ci && npm run build -w app
        if: github.ref == 'refs/heads/dual-look'
        working-directory: main-site/refinery-digital-twin-starter
      - name: Assemble main root and branch preview
        if: github.ref == 'refs/heads/dual-look'
        working-directory: .
        run: |
          mkdir -p site/next
          cp -a main-site/refinery-digital-twin-starter/app/dist/. site/
          cp -a refinery-digital-twin-starter/app/dist/. site/next/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/dual-look'
        with:
          path: site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref != 'refs/heads/dual-look'
        with:
          path: refinery-digital-twin-starter/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

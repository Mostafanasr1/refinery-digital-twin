name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: refinery-digital-twin-starter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: refinery-digital-twin-starter/package-lock.json
      - run: npm ci
      - run: npm run test -w app
      # Builds from the committed data/normalized output (same as the Dockerfile); run
      # `npm run normalize` locally after editing data/synthetic.
      - run: npm run build -w app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: refinery-digital-twin-starter/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

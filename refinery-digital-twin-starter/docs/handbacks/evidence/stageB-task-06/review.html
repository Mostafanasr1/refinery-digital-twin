<!doctype html><html lang="en"><meta charset="utf-8"><title>Task 6 visual gate</title>
<style>body{font:16px system-ui;background:#0b1821;color:#def0f5;margin:24px}select,a{color:#8fe1ef}select{background:#142d3a;padding:8px}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}img{width:100%;border:1px solid #35505f}p{color:#b4c4cd}video{width:70%;max-width:1100px}</style>
<header><h1>Task 6 visual gate</h1><label>Camera <select id="camera"></select></label><label>Look <select id="look"><option value="photoreal">Day</option><option value="photoreal-night" selected>Night</option></select></label></header>
<p>Same canonical plant and approved cameras. ACES is the proposed retained mapping. Whole-image acceptance, density dressing, and Tasks 5b/7 await Mostafa. Click images for full resolution.</p>
<main><section><h2>ACES</h2><a id="acesLink"><img id="aces" alt="ACES candidate"></a></section><section><h2>AgX comparison</h2><a id="agxLink"><img id="agx" alt="AgX comparison"></a></section></main>
<h2>Reference — review only</h2><a id="referenceLink"><img id="reference" style="max-width:1200px" alt="User supplied appearance reference"></a>
<h2>CAM-5 flare — 10 seconds</h2><video controls src="CAM-5-flare.mp4"></video>
<script>const camera=document.querySelector('#camera'),look=document.querySelector('#look');for(let i=1;i<=6;i++){const option=new Option(`CAM-${i}`,`CAM-${i}`,i===6,i===6);camera.add(option)}function update(){for(const tone of ['aces','agx']){const path=`${camera.value}-${look.value}-${tone}.png`;document.getElementById(tone).src=path;document.getElementById(tone+'Link').href=path}const path='../../../reference/'+(look.value==='photoreal-night'?'mood-dusk.png':'petromind-wide.png');document.querySelector('#reference').src=path;document.querySelector('#referenceLink').href=path}camera.onchange=look.onchange=update;update();</script></html>
